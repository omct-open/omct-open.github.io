<text x="70" y="290.4" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="start">interacción</text>
<text x="70" y="366.0" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="start">de cinco</text>
<text x="70" y="441.6" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="start">placas</text>
<text x="70" y="547.2" font-size="28" font-weight="400" fill="#EADBC8" text-anchor="start">Se mueven unos centímetros al</text>
<text x="70" y="582.2" font-size="28" font-weight="400" fill="#EADBC8" text-anchor="start">año, y eso explica nuestros sismos,</text>
<text x="70" y="617.2" font-size="28" font-weight="400" fill="#EADBC8" text-anchor="start">nuestros volcanes y hasta la forma</text>
<text x="70" y="652.2" font-size="28" font-weight="400" fill="#EADBC8" text-anchor="start">del país.</text>
